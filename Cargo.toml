[package]
name = "svn2git"
version = "0.4.0"
authors = ["Eduardo Sánchez Muñoz <eduardosm-dev@e64.io>"]
edition = "2024"
rust-version = "1.85"
description = "A Subversion-to-Git repository converter"
repository = "https://github.com/eduardosm/svn2git"
license = "MIT OR Apache-2.0"
keywords = ["converter", "git", "repository", "subversion", "svn"]
categories = ["development-tools"]
exclude = ["/.github", "/book", "/ci", ".gitignore"]
publish = true

[[test]]
name = "convert"
path = "convert-tests/main.rs"
harness = false

[dependencies]
bzip2 = { version = "0.6.1", features = ["static"] }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
cyclic-poly-23 = "0.4.0"
flate2 = "1.1.10"
foldhash = "0.2.0"
gix-actor = "0.42.0"
gix-date = "0.16.0"
gix-features = "0.49.1"
gix-hash = { version = "0.26.2", features = ["sha1", "sha256"] }
gix-object = "0.64.1"
gix-pack = "0.74.2"
gix-zlib = "0.1.0"
indoc = "2.0.7"
liblzma = { version = "0.4.8", features = ["static"] }
lru-mem = "0.3.0"
lz4_flex = "0.14.0"
minijinja = "2.24.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
smallvec = "1.16.0"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.26.0"
zstd = "0.14.0"

[dependencies.regex-automata]
version = "0.4.18"
default-features = false
features = ["dfa", "hybrid", "meta", "nfa", "perf", "std", "syntax"]

[dependencies.regex-syntax]
version = "0.8.11"
default-features = false
features = ["std"]

[dev-dependencies]
gix = { version = "0.87.1", features = ["sha1", "sha256"] }
libtest-mimic = "0.8.2"
serde_yaml = "0.9.34"

[profile.dev]
opt-level = 1

[profile.release]
strip = "debuginfo"
panic = "abort"
lto = true
codegen-units = 1
